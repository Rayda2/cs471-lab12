<h1>Register</h1>

{% for message in messages %}
<p>{{ message }}</p>
{% endfor %}

<form method="POST">

    {% csrf_token %}

    <input type="text" name="username" placeholder="Username">

    <br><br>

    <input type="password" name="password" placeholder="Password">

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

<a href="/users/login">
    Login
</a>
